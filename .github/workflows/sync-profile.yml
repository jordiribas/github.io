name: "Perfil GitHub — Sincronizar README"

on:
  push:
    branches: [source]
    paths:
      - 'profile/README.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar README para jordiribas/jordiribas
        env:
          TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          SHA=$(curl -sf \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/jordiribas/jordiribas/contents/README.md" \
            | jq -r '.sha // empty')

          CONTENT=$(base64 -w 0 profile/README.md)

          if [ -n "$SHA" ]; then
            DATA=$(jq -n \
              --arg msg "sync: atualiza perfil a partir do github.io" \
              --arg content "$CONTENT" \
              --arg sha "$SHA" \
              '{message: $msg, content: $content, sha: $sha}')
          else
            DATA=$(jq -n \
              --arg msg "sync: atualiza perfil a partir do github.io" \
              --arg content "$CONTENT" \
              '{message: $msg, content: $content}')
          fi

          curl -sf -X PUT \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "$DATA" \
            "https://api.github.com/repos/jordiribas/jordiribas/contents/README.md"

          echo "Perfil sincronizado com sucesso."
