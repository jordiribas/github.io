name: "Perfil GitHub — Sincronizar README"

on:
  push:
    branches: [source]
    paths:
      - 'profile/README.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar README para jordiribas/jordiribas
        env:
          TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          git config --global user.name "jordiribas"
          git config --global user.email "jordi@jribas.com.br"
          git config --global credential.helper store
          echo "https://x-access-token:${TOKEN}@github.com" > ~/.git-credentials

          git clone https://github.com/jordiribas/jordiribas.git _profile_repo

          cp profile/README.md _profile_repo/README.md

          cd _profile_repo
          git add README.md
          git diff --staged --quiet && echo "Sem mudanças." && exit 0
          git commit -m "sync: atualiza perfil a partir do github.io"
          git push origin HEAD
