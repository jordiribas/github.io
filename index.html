<!DOCTYPE html>

  <meta property="og:site_name" content="JRibas" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:url" content="https://jribas.com.br/" />
  <meta property="og:title" content="JRibas — Automação & Integrações" />
  <meta property="og:description" content="Automação de processos e integração entre sistemas. n8n, APIs, webhooks e muito mais." />
  <meta property="og:image" content="https://jribas.com.br/og-image.png" />

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />

  <style>*,:before,:after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0b0b09;--surface:#141410;--border:#2a2a24;--text:#e8e6df;--muted:#6b6b5e;--accent:oklch(65% .18 235);--accent-dim:oklch(65% .18 235/.12);--font-mono:"JetBrains Mono", monospace;--font-sans:"Space Grotesk", sans-serif}@media (prefers-color-scheme:light){:root{--bg:#f2f1ed;--surface:#e8e6df;--border:#ccc9bc;--text:#1a1a14;--muted:#7a7a6a;--accent:oklch(48% .18 235);--accent-dim:oklch(48% .18 235/.1)}}html,body{background:var(--bg);height:100%;color:var(--text);font-family:var(--font-mono);-webkit-font-smoothing:antialiased}body{flex-direction:column;justify-content:center;align-items:center;gap:0;min-height:100dvh;padding:2rem;display:flex}.grid-bg{background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);opacity:.35;pointer-events:none;z-index:0;background-size:40px 40px;position:fixed;inset:0}.card{z-index:1;border:1px solid var(--border);background:var(--surface);flex-direction:column;gap:1.5rem;width:100%;max-width:480px;padding:2.5rem 2rem;display:flex;position:relative}.badge{letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent);align-items:center;gap:.5rem;width:fit-content;padding:.3rem .75rem;font-size:.7rem;font-weight:600;display:inline-flex}.badge:before{content:"";background:var(--accent);border-radius:50%;width:6px;height:6px;animation:2s ease-in-out infinite pulse}@keyframes pulse{0%,to{opacity:1}50%{opacity:.3}}.title{font-family:var(--font-sans);letter-spacing:-.02em;color:var(--text);font-size:clamp(1.5rem,5vw,2rem);font-weight:700;line-height:1.15}.subtitle{color:var(--muted);font-size:.85rem;line-height:1.6}.divider{background:var(--border);height:1px}.links{flex-direction:column;gap:.5rem;display:flex}.link-row{color:var(--muted);align-items:center;gap:.75rem;font-size:.8rem;display:flex}.link-row a{color:var(--text);border-bottom:1px solid var(--border);text-decoration:none;transition:color .15s,border-color .15s}.link-row a:hover{color:var(--accent);border-color:var(--accent)}.link-row .label{letter-spacing:.06em;text-transform:uppercase;min-width:3.5rem;color:var(--muted);font-size:.65rem}.footer{z-index:1;color:var(--muted);letter-spacing:.04em;text-align:center;margin-top:2rem;font-size:.65rem;position:relative}</style>

  <script>
    (function(){
      try {
        var v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = v;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="badge">Em construção</div>

    <div>
      <h1 class="title">JRibas<br/>Automação & Integrações</h1>
    </div>

    <p class="subtitle">
      Novo site chegando em breve.<br/>
      Enquanto isso, me encontre pelo LinkedIn ou e-mail.
    </p>

    <div class="divider"></div>

    <div class="links">
      <div class="link-row">
        <span class="label">LinkedIn</span>
        <a href="https://www.linkedin.com/in/jordi-ribas/" target="_blank" rel="noopener">linkedin.com/in/jordi-ribas</a>
      </div>
      <div class="link-row">
        <span class="label">E-mail</span>
        <a href="mailto:jordi@jribas.com.br">jordi@jribas.com.br</a>
      </div>
    </div>
  </div>

  <p class="footer">jribas.com.br</p>
</body>
</html>
