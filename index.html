<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b09" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)" />
  <title>JRibas — Em breve</title>
  <meta name="description" content="JRibas — especialista em automação de processos e integração entre sistemas. Site em construção." />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b09;
      --surface: #141410;
      --border: #2a2a24;
      --text: #e8e6df;
      --muted: #6b6b5e;
      --accent: oklch(65% 0.18 235);
      --accent-dim: oklch(65% 0.18 235 / 0.12);
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Space Grotesk', sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f1ed;
        --surface: #e8e6df;
        --border: #ccc9bc;
        --text: #1a1a14;
        --muted: #7a7a6a;
        --accent: oklch(48% 0.18 235);
        --accent-dim: oklch(48% 0.18 235 / 0.1);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      gap: 0;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      padding: 0.3rem 0.75rem;
      width: fit-content;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .title {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .link-row a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s;
    }

    .link-row a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .link-row .label {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-width: 3.5rem;
      color: var(--muted);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: center;
    }
  </style>

  <script>
    (function(){
      try {
        var v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = v;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="badge">Em construção</div>

    <div>
      <h1 class="title">JRibas<br/>Automação & Integrações</h1>
    </div>

    <p class="subtitle">
      Novo site chegando em breve.<br/>
      Enquanto isso, me encontre pelo LinkedIn ou e-mail.
    </p>

    <div class="divider"></div>

    <div class="links">
      <div class="link-row">
        <span class="label">LinkedIn</span>
        <a href="https://www.linkedin.com/in/jordi-ribas/" target="_blank" rel="noopener">linkedin.com/in/jordi-ribas</a>
      </div>
      <div class="link-row">
        <span class="label">E-mail</span>
        <a href="mailto:jordi@jribas.com.br">jordi@jribas.com.br</a>
      </div>
    </div>
  </div>

  <p class="footer">jribas.com.br</p>
</body>
</html>
