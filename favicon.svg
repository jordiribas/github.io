<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- background -->
  <rect width="32" height="32" fill="#0d1628"/>

  <!-- subtle circuit grid lines -->
  <line x1="0" y1="10" x2="32" y2="10" stroke="#1a2a42" stroke-width="0.5"/>
  <line x1="0" y1="22" x2="32" y2="22" stroke="#1a2a42" stroke-width="0.5"/>
  <line x1="10" y1="0" x2="10" y2="32" stroke="#1a2a42" stroke-width="0.5"/>
  <line x1="22" y1="0" x2="22" y2="32" stroke="#1a2a42" stroke-width="0.5"/>

  <!-- outer border -->
  <rect x="2.5" y="2.5" width="27" height="27" fill="none" stroke="#58c8f8" stroke-width="1.5"/>

  <!-- circuit connectors — top -->
  <rect x="10" y="0" width="4" height="2.5" fill="#58c8f8"/>
  <rect x="18" y="0" width="4" height="2.5" fill="#58c8f8"/>
  <!-- circuit connectors — bottom -->
  <rect x="10" y="29.5" width="4" height="2.5" fill="#58c8f8"/>
  <rect x="18" y="29.5" width="4" height="2.5" fill="#58c8f8"/>
  <!-- circuit connectors — left -->
  <rect x="0" y="10" width="2.5" height="4" fill="#58c8f8"/>
  <rect x="0" y="18" width="2.5" height="4" fill="#58c8f8"/>
  <!-- circuit connectors — right -->
  <rect x="29.5" y="10" width="2.5" height="4" fill="#58c8f8"/>
  <rect x="29.5" y="18" width="2.5" height="4" fill="#58c8f8"/>

  <!-- corner dots -->
  <rect x="2.5" y="2.5" width="2" height="2" fill="#58c8f8"/>
  <rect x="27.5" y="2.5" width="2" height="2" fill="#58c8f8"/>
  <rect x="2.5" y="27.5" width="2" height="2" fill="#58c8f8"/>
  <rect x="27.5" y="27.5" width="2" height="2" fill="#58c8f8"/>

  <!-- JR text -->
  <text x="16" y="21.5" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">JR</text>
</svg>
